<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1085" viewBox="0 0 1600 1085" role="img" aria-labelledby="title desc"><title id="title">How DroidDesk templates reduce repeated AI model calls</title><desc id="desc">An AI prepares a supported task and saves a template. The executor runs saved steps without AI tokens. The result is checked, with AI used as needed. Phone rental, AI assistance and optional SMS orders have separate costs.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2764E7" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1600" height="1085" rx="0" fill="#F6F8FC" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="285" rx="0" fill="#12243D" stroke="none" stroke-width="2"/><text x="70" y="72" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#9CC0FF" >DROIDDESK</text><text x="1530" y="72" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B6C8E0" text-anchor="end">ANDROID AUTOMATION</text><text x="70" y="157" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" >Use AI to prepare the task.</text><text x="70" y="227" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" >Run repeatable steps without model calls.</text><rect x="70" y="345" width="440" height="405" rx="22" fill="#FFFFFF" stroke="#CCD8E8" stroke-width="2"/><text x="98" y="397" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#2764E7" >01  SET UP</text><text x="98" y="463" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#15243B" >AI prepares</text><text x="98" y="523" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53677E" >Inspect the phone.</text><text x="98" y="566" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53677E" >Test supported steps.</text><text x="98" y="609" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53677E" >Save inputs and checks.</text><rect x="94" y="668" width="392" height="54" rx="13" fill="#EEF4FF" stroke="none" stroke-width="2"/><text x="290" y="703" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#2764E7" text-anchor="middle">Preparation uses AI</text><path d="M523 546 H564" fill="none" stroke="#2764E7" stroke-width="4" marker-end="url(#arrow)"/><rect x="580" y="345" width="440" height="405" rx="22" fill="#FFFFFF" stroke="#CCD8E8" stroke-width="2"/><text x="608" y="397" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#087F77" >02  REPEAT</text><text x="608" y="463" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#15243B" >Executor runs</text><text x="608" y="523" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53677E" >Swipes, taps and text.</text><text x="608" y="566" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53677E" >Configured pauses.</text><text x="608" y="609" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53677E" >Supported SMS steps.</text><rect x="604" y="668" width="392" height="54" rx="13" fill="#DFEFEB" stroke="none" stroke-width="2"/><text x="800" y="703" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#087F77" text-anchor="middle">Saved steps use no AI tokens</text><path d="M1033 546 H1074" fill="none" stroke="#2764E7" stroke-width="4" marker-end="url(#arrow)"/><rect x="1090" y="345" width="440" height="405" rx="22" fill="#FFFFFF" stroke="#CCD8E8" stroke-width="2"/><text x="1118" y="397" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#2764E7" >03  REVIEW</text><text x="1118" y="463" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#15243B" >Check the result</text><text x="1118" y="523" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53677E" >Read the run status.</text><text x="1118" y="566" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53677E" >Inspect exceptions.</text><text x="1118" y="609" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53677E" >Use AI when needed.</text><rect x="1114" y="668" width="392" height="54" rx="13" fill="#EEF4FF" stroke="none" stroke-width="2"/><text x="1310" y="703" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#2764E7" text-anchor="middle">AI review can use tokens</text><rect x="70" y="805" width="1460" height="168" rx="22" fill="#12243D" stroke="none" stroke-width="2"/><text x="108" y="855" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#FFFFFF" >Keep the costs separate</text><text x="108" y="910" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" fill="#D9E7FB" >Phone rental</text><text x="575" y="910" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" fill="#D9E7FB" >AI preparation and review</text><text x="1135" y="910" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" fill="#D9E7FB" >Optional SMS orders</text><text x="108" y="949" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#B6C8E0" >MCP access is included</text><text x="575" y="949" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#B6C8E0" >Your model provider’s terms</text><text x="1135" y="949" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#B6C8E0" >Your provider balance</text><text x="70" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#15243B" >droiddesk.io</text><text x="1530" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#53677E" text-anchor="end">Execution model · No fixed savings percentage implied</text></svg>