<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc"><title id="title">How an AI agent controls a real Android phone through DroidDesk MCP</title><desc id="desc">The user gives a task. The AI agent reads the screen and sends actions through DroidDesk MCP to a physical Android phone. The updated screen returns to the agent for verification. Some tasks need user input.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2764E7" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1600" height="1260" rx="0" fill="#F6F8FC" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="330" rx="0" fill="#12243D" stroke="none" stroke-width="2"/><text x="70" y="75" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#9CC0FF" >DROIDDESK MCP</text><text x="1530" y="75" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B6C8E0" text-anchor="end">AI PHONE CONTROL</text><text x="70" y="165" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" >From your instruction</text><text x="70" y="242" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" >to actions on a real phone</text><rect x="70" y="370" width="1460" height="108" rx="20" fill="#FFFFFF" stroke="#CCD8E8" stroke-width="2"/><text x="100" y="414" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2764E7" >EXAMPLE TASK</text><text x="100" y="455" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#15243B" >“Open the website, find its weekly plan and show me the screen.”</text><rect x="70" y="540" width="320" height="260" rx="22" fill="#FFFFFF" stroke="#CCD8E8" stroke-width="2"/><rect x="94" y="565" width="55" height="48" rx="12" fill="#EEF4FF" stroke="none" stroke-width="2"/><text x="121" y="599" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2764E7" text-anchor="middle">01</text><text x="94" y="670" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#15243B" >You</text><text x="94" y="724" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#53677E" >Describe the task</text><text x="94" y="760" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#53677E" >and choose a phone.</text><path d="M403 667 H435" fill="none" stroke="#2764E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="450" y="540" width="320" height="260" rx="22" fill="#FFFFFF" stroke="#CCD8E8" stroke-width="2"/><rect x="474" y="565" width="55" height="48" rx="12" fill="#EEF4FF" stroke="none" stroke-width="2"/><text x="501" y="599" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2764E7" text-anchor="middle">02</text><text x="474" y="670" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#15243B" >AI agent</text><text x="474" y="724" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#53677E" >Reads the screen</text><text x="474" y="760" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#53677E" >and chooses an action.</text><path d="M783 667 H815" fill="none" stroke="#2764E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="830" y="540" width="320" height="260" rx="22" fill="#FFFFFF" stroke="#CCD8E8" stroke-width="2"/><rect x="854" y="565" width="55" height="48" rx="12" fill="#EEF4FF" stroke="none" stroke-width="2"/><text x="881" y="599" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2764E7" text-anchor="middle">03</text><text x="854" y="670" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#15243B" >DroidDesk MCP</text><text x="854" y="724" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#53677E" >Applies the access</text><text x="854" y="760" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#53677E" >granted by your key.</text><path d="M1163 667 H1195" fill="none" stroke="#2764E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1210" y="540" width="320" height="260" rx="22" fill="#FFFFFF" stroke="#CCD8E8" stroke-width="2"/><rect x="1234" y="565" width="55" height="48" rx="12" fill="#EEF4FF" stroke="none" stroke-width="2"/><text x="1261" y="599" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2764E7" text-anchor="middle">04</text><text x="1234" y="670" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#15243B" >Real Android</text><text x="1234" y="724" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#53677E" >Runs the app</text><text x="1234" y="760" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#53677E" >on physical hardware.</text><path d="M1370 817 V910 H610 V817" fill="none" stroke="#2764E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="805" y="886" width="389" height="48" rx="0" fill="#F6F8FC" stroke="none" stroke-width="2"/><text x="1000" y="920" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#2764E7" text-anchor="middle">Updated screen → agent</text><text x="800" y="990" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#15243B" text-anchor="middle">Observe → act → check → continue</text><rect x="70" y="1040" width="1460" height="120" rx="22" fill="#DFEFEB" stroke="none" stroke-width="2"/><text x="105" y="1087" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#087F77" >Your agent checks what happened</text><text x="105" y="1129" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#087F77" >The next screen helps confirm the result. Some tasks need your input.</text><text x="70" y="1216" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#15243B" >droiddesk.io</text><text x="1530" y="1216" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#53677E" text-anchor="end">How it works · Access follows your key permissions</text></svg>