<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="985" viewBox="0 0 1600 985" role="img" aria-labelledby="title desc"><title id="title">SMS verification through DroidDesk and a connected provider</title><desc id="desc">A compatible registration flow checks an offer, requests a number, enters it on a real Android phone, retrieves the SMS code through a provider API and checks the resulting screen. SMS charges apply. Additional checks may need the user.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2764E7" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1600" height="985" rx="0" fill="#F6F8FC" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="285" rx="0" fill="#12243D" stroke="none" stroke-width="2"/><text x="70" y="72" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#9CC0FF" >DROIDDESK + SMS PROVIDER</text><text x="1530" y="72" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B6C8E0" text-anchor="end">SUPPORTED REGISTRATION FLOW</text><text x="70" y="157" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF" >From a verification number</text><text x="70" y="227" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF" >to a checked result on the phone</text><rect x="70" y="345" width="320" height="330" rx="22" fill="#FFFFFF" stroke="#CCD8E8" stroke-width="2"/><rect x="94" y="369" width="56" height="48" rx="12" fill="#EEF4FF" stroke="none" stroke-width="2"/><text x="122" y="402" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#2764E7" text-anchor="middle">01</text><text x="92" y="473" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#15243B" >Get a number</text><text x="92" y="534" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#53677E" >Check service and country.</text><text x="92" y="574" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#53677E" >Order within your limit.</text><text x="92" y="614" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#53677E" >Use your provider account.</text><path d="M403 505 H434" fill="none" stroke="#2764E7" stroke-width="4" marker-end="url(#arrow)"/><rect x="450" y="345" width="320" height="330" rx="22" fill="#FFFFFF" stroke="#CCD8E8" stroke-width="2"/><rect x="474" y="369" width="56" height="48" rx="12" fill="#EEF4FF" stroke="none" stroke-width="2"/><text x="502" y="402" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#2764E7" text-anchor="middle">02</text><text x="472" y="473" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#15243B" >Fill the form</text><text x="472" y="534" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#53677E" >Enter the returned number</text><text x="472" y="574" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#53677E" >on the real Android phone.</text><text x="472" y="614" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#53677E" >Request the site’s SMS.</text><path d="M783 505 H814" fill="none" stroke="#2764E7" stroke-width="4" marker-end="url(#arrow)"/><rect x="830" y="345" width="320" height="330" rx="22" fill="#FFFFFF" stroke="#CCD8E8" stroke-width="2"/><rect x="854" y="369" width="56" height="48" rx="12" fill="#EEF4FF" stroke="none" stroke-width="2"/><text x="882" y="402" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#2764E7" text-anchor="middle">03</text><text x="852" y="473" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#15243B" >Retrieve the code</text><text x="852" y="534" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#53677E" >Wait through the API.</text><text x="852" y="574" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#53677E" >Read the received code.</text><text x="852" y="614" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#53677E" >Enter it on the phone.</text><path d="M1163 505 H1194" fill="none" stroke="#2764E7" stroke-width="4" marker-end="url(#arrow)"/><rect x="1210" y="345" width="320" height="330" rx="22" fill="#FFFFFF" stroke="#CCD8E8" stroke-width="2"/><rect x="1234" y="369" width="56" height="48" rx="12" fill="#EEF4FF" stroke="none" stroke-width="2"/><text x="1262" y="402" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#2764E7" text-anchor="middle">04</text><text x="1232" y="473" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#15243B" >Check the result</text><text x="1232" y="534" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#53677E" >Inspect the next screen.</text><text x="1232" y="574" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#53677E" >Confirm the outcome.</text><text x="1232" y="614" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#53677E" >Handle extra checks.</text><rect x="70" y="732" width="1460" height="142" rx="22" fill="#DFEFEB" stroke="none" stroke-width="2"/><text x="108" y="787" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#087F77" >Manage the task from your assistant</text><text x="108" y="834" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#087F77" >You can open the phone view when needed. Additional checks may require your participation.</text><text x="70" y="942" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#15243B" >droiddesk.io</text><text x="1530" y="942" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#53677E" text-anchor="end">SMS orders are paid · Delivery and acceptance depend on the service</text></svg>