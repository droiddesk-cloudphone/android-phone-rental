<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090" role="img" aria-labelledby="title desc"><title id="title">Three ways to control a real Android phone with DroidDesk</title><desc id="desc">A browser, desktop client or AI agent connects to a physical hosted Android phone. AI control uses DroidDesk MCP. MCP access is included in the rental.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2764E7" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1600" height="1090" rx="0" fill="#F6F8FC" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="330" rx="0" fill="#12243D" stroke="none" stroke-width="2"/><text x="70" y="75" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#9CC0FF" >DROIDDESK</text><text x="1530" y="75" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B6C8E0" text-anchor="end">REAL ANDROID ACCESS</text><text x="70" y="165" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" >One real Android phone.</text><text x="70" y="242" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" >Your choice of control.</text><rect x="70" y="375" width="720" height="132" rx="20" fill="#FFFFFF" stroke="#CCD8E8" stroke-width="2"/><rect x="100" y="409" width="70" height="54" rx="8" fill="none" stroke="#2764E7" stroke-width="2"/><path d="M100 425 H170" fill="none" stroke="#2764E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="110" cy="417" r="2" fill="#2764E7"/><text x="200" y="418" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#15243B" >Web browser</text><text x="200" y="457" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#53677E" >View the screen. Click, type</text><text x="200" y="489" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#53677E" >and swipe from your computer.</text><path d="M805 441 H865" fill="none" stroke="#2764E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="70" y="530" width="720" height="132" rx="20" fill="#FFFFFF" stroke="#CCD8E8" stroke-width="2"/><rect x="104" y="564" width="62" height="43" rx="7" fill="none" stroke="#2764E7" stroke-width="2"/><path d="M97 616 H173" fill="none" stroke="#2764E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M127 616 H143" fill="none" stroke="#2764E7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="573" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#15243B" >Desktop client</text><text x="200" y="612" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#53677E" >Connect through the optional</text><text x="200" y="644" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#53677E" >remote-control app.</text><path d="M805 596 H865" fill="none" stroke="#2764E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="70" y="685" width="720" height="132" rx="20" fill="#FFFFFF" stroke="#CCD8E8" stroke-width="2"/><rect x="104" y="729" width="62" height="43" rx="12" fill="none" stroke="#2764E7" stroke-width="2"/><path d="M135 729 V719" fill="none" stroke="#2764E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="135" cy="719" r="4" fill="#2764E7"/><circle cx="122" cy="749" r="4" fill="#2764E7"/><circle cx="148" cy="749" r="4" fill="#2764E7"/><path d="M125 761 H145" fill="none" stroke="#2764E7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="728" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#15243B" >Your AI agent + MCP</text><text x="200" y="767" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#53677E" >Describe a task. Let the agent</text><text x="200" y="799" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#53677E" >act and check the result.</text><path d="M805 751 H865" fill="none" stroke="#2764E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M865 441 V751 M865 596 H962" fill="none" stroke="#2764E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1005" y="365" width="350" height="420" rx="44" fill="#12243D" stroke="none" stroke-width="2"/><rect x="1022" y="385" width="316" height="378" rx="31" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="1113" y="396" width="135" height="10" rx="5" fill="#CCD8E8" stroke="none" stroke-width="2"/><text x="1180" y="470" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#15243B" text-anchor="middle">REAL ANDROID</text><text x="1180" y="509" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#53677E" text-anchor="middle">Physical hosted phone</text><rect x="1058" y="547" width="58" height="58" rx="15" fill="#2764E7" stroke="none" stroke-width="2"/><rect x="1143" y="547" width="58" height="58" rx="15" fill="#EEF4FF" stroke="none" stroke-width="2"/><rect x="1228" y="547" width="58" height="58" rx="15" fill="#EEF4FF" stroke="none" stroke-width="2"/><rect x="1058" y="626" width="58" height="58" rx="15" fill="#EEF4FF" stroke="none" stroke-width="2"/><rect x="1143" y="626" width="58" height="58" rx="15" fill="#D9F3EF" stroke="none" stroke-width="2"/><rect x="1228" y="626" width="58" height="58" rx="15" fill="#EEF4FF" stroke="none" stroke-width="2"/><path d="M1150 739 H1210" fill="none" stroke="#CCD8E8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="1180" y="825" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#53677E" text-anchor="middle">Choose an available model and location</text><rect x="70" y="875" width="1460" height="115" rx="22" fill="#DFEFEB" stroke="none" stroke-width="2"/><text x="105" y="923" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#087F77" >MCP access is included in your rental</text><text x="105" y="961" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#087F77" >Your AI provider may charge separately. App access follows your rental plan.</text><text x="70" y="1044" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#15243B" >droiddesk.io</text><text x="1530" y="1044" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#53677E" text-anchor="end">Illustration · Device and feature availability vary</text></svg>